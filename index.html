<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="#" method="GET">
    <label>
      Login:<br/>
      <input type="text" name="login" enterkeyhint="enter" />
    </label>
    
    <br/>
    <br/>

    <label>
      Password:<br/>
      <input type="password" name="password" enterkeyhint="go" />
    </label>

    <br/>
    <br/>

    <label for="order-num">Order num</label>
    <input type="numeric" name="order-num" id="order-num" enterkeyhint="next"/>

    <br/>
    <br/>

    <label for="order-num">Order sum</label>
    <input type="numeric" name="order-sum" id="order-sum" enterkeyhint="previous"/>

    <br/>
    <br/>
    
    <label for="animal">What is your favourite animal?</label>
    <input required pattern="[a-z]{2,20}" type="text" id="animal" name="animal" enterkeyhint="done" />

    <br/>

    <label for="color">What is your favourite color?</label>
    <input required pattern="[a-z]{2,20}" type="text" id="color" name="color" enterkeyhint="search" />

    <br/>
    <br/>

    <label for="os">What is your favourite OS?</label>
    <input required pattern="[a-z]{2,20}" type="text" id="os" name="os" enterkeyhint="send" />

    <br/>
    <br/>
    
    <button type="submit">Submit</button>
  </form>
</body>
</html>
